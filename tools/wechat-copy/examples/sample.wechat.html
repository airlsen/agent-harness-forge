<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公众号排版预览 - sample.html</title>
<style>
  body { margin: 0; background: #f3f4f6; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .toolbar {
    position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; background: #1f2937; color: #fff; font-size: 14px;
  }
  .toolbar button {
    padding: 8px 20px; font-size: 14px; border: 0; border-radius: 6px;
    background: #07c160; color: #fff; cursor: pointer;
  }
  .toolbar button:hover { background: #06ad56; }
  .toolbar .tip { color: #9ca3af; }
  .phone {
    max-width: 677px; margin: 24px auto; background: #fff;
    padding: 20px 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
</style>
</head>
<body>
<div class="toolbar">
  <button id="copyBtn">复制正文</button>
  <span id="status" class="tip">点击复制后，到公众号后台编辑器 Ctrl+V 粘贴（共 0 张图片，粘贴后请检查图片是否正常）</span>
</div>
<div class="phone">
  <div id="wx-content"><h1 style="font-size: 22px; color: #1a5276; text-align: center; border-bottom: 2px solid #1a5276; padding-bottom: 10px">这是一篇测试文章</h1>
  <p style="background: #eaf2f8; padding: 14px 18px; border-left: 4px solid #1a5276; border-radius: 4px">导语：这段文字带底色和左边框，用来验证 class 样式能否正确内联化。</p>

  <p>正文里有一段 <code style="background: #f0f0f0; color: #c0392b; padding: 2px 6px; border-radius: 4px; font-family: Menlo, monospace">inline_code()</code> 行内代码。</p>

  <div style="background: #fef9e7; border: 1px solid #f7dc6f; border-radius: 8px; padding: 16px; margin: 16px 0">
    <h3 style="margin: 0 0 8px; color: #b7950b">💡 小贴士卡片</h3>
    <p>卡片样式：底色 + 边框 + 圆角，粘贴到公众号后应该完整保留。</p>
  </div>

  <pre style="background: #2d2d2d; color: #f8f8f2; padding: 14px; border-radius: 8px; font-family: Menlo, monospace; font-size: 13px">def hello():
    print("代码块样式测试")</pre>

  <table style="border-collapse: collapse; width: 100%" width="100%">
    <tbody><tr><th style="background: #1a5276; color: #fff; padding: 8px; border: 1px solid #ddd">名称</th><th style="background: #1a5276; color: #fff; padding: 8px; border: 1px solid #ddd">说明</th></tr>
    <tr><td style="padding: 8px; border: 1px solid #ddd">juice</td><td style="padding: 8px; border: 1px solid #ddd">CSS 内联化</td></tr>
    <tr><td style="padding: 8px; border: 1px solid #ddd">cheerio</td><td style="padding: 8px; border: 1px solid #ddd">HTML 清洗</td></tr>
  </tbody></table>

  <p>这段含 position:fixed 和 onclick，应被清洗。</p></div>
</div>
<script>
const btn = document.getElementById('copyBtn');
const statusEl = document.getElementById('status');

function fallbackCopy() {
  // 兼容方案：选中正文区域后用 execCommand 复制
  const range = document.createRange();
  range.selectNode(document.getElementById('wx-content'));
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  const ok = document.execCommand('copy');
  sel.removeAllRanges();
  return ok;
}

btn.addEventListener('click', async () => {
  const content = document.getElementById('wx-content');
  const html = content.innerHTML;
  const text = content.innerText;
  try {
    const item = new ClipboardItem({
      'text/html': new Blob([html], { type: 'text/html' }),
      'text/plain': new Blob([text], { type: 'text/plain' }),
    });
    await navigator.clipboard.write([item]);
    statusEl.textContent = '✅ 已复制！去公众号后台 Ctrl+V 粘贴';
  } catch (e) {
    if (fallbackCopy()) {
      statusEl.textContent = '✅ 已复制（兼容模式）！去公众号后台 Ctrl+V 粘贴';
    } else {
      statusEl.textContent = '❌ 自动复制失败：请手动框选下方正文区域后 Ctrl+C';
    }
  }
});
</script>
</body>
</html>
